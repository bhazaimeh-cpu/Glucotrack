<title>GlucoTrack — Blood Sugar & Lifestyle Companion</title>
<style>
:root{
  --blue:#1F4E79; --blue2:#2E6DA4; --bg:#F0F4F8; --card:#FFFFFF;
  --green:#2E8B57; --amber:#C77700; --red:#C0392B; --ink:#1c2833;
  --muted:#6b7a88; --line:#dbe4ec;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:70px}
header{background:linear-gradient(135deg,#1F4E79,#2E6DA4);color:#fff;padding:18px 16px 12px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1.25rem;letter-spacing:.5px}
header p{font-size:.8rem;opacity:.85;margin-top:2px}
#langBtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:.85rem;white-space:nowrap;margin-left:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--blue);display:flex;z-index:10}
nav button{flex:1;background:none;border:none;color:#cfe0f0;padding:10px 2px;font-size:.62rem;cursor:pointer;text-align:center}
nav button.active{color:#fff;background:var(--blue2);font-weight:700}
nav button .ic{display:block;font-size:1.15rem;margin-bottom:2px}
main{max-width:760px;margin:0 auto;padding:14px}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(20,40,60,.08)}
.card h3{font-size:.95rem;color:var(--blue);margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:#EAF2FA;border-radius:12px;padding:12px;text-align:center}
.stat .v{font-size:1.5rem;font-weight:800;color:var(--blue)}
.stat .l{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
label{display:block;font-size:.75rem;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:.95rem;background:#fbfdff}
.btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:.9rem;font-weight:700;cursor:pointer;width:100%;margin-top:12px}
.btn.ghost{background:#EAF2FA;color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{padding:8px 6px;text-align:start;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.4px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.68rem;font-weight:700;color:#fff;white-space:nowrap}
.b-green{background:var(--green)}.b-amber{background:var(--amber)}.b-red{background:var(--red)}.b-gray{background:#7f8c9b}
canvas#chart{width:100%;height:260px;background:#fbfdff;border:1px solid var(--line);border-radius:12px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.chk input{width:20px;height:20px}
.imgwrap img{width:100%;border-radius:12px;border:1px solid var(--line)}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:.68rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:#fff;white-space:nowrap}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.legend{font-size:.75rem;color:var(--muted);line-height:1.6}
.sw{display:flex;gap:8px;margin-top:10px}
.sw button{flex:1}
.small{font-size:.75rem;color:var(--muted)}
.tip{border-left:4px solid var(--amber);background:#FFF8EC;padding:10px 12px;border-radius:0 10px 10px 0;font-size:.82rem;margin-top:10px;line-height:1.6}
[dir="rtl"] .tip{border-left:none;border-right:4px solid var(--amber);border-radius:10px 0 0 10px}
.foodname{font-weight:700}
h4.sec{font-size:.85rem;color:var(--ink);margin:14px 0 6px}
.filterbar{position:sticky;top:74px;background:var(--bg);padding:6px 0;z-index:5}
</style>
</head>
<body>

<header>
  <div>
    <h1>🩸 GlucoTrack</h1>
    <p data-i18n="hdr_sub"></p>
    <p data-i18n="hdr_dev" style="opacity:.75;font-size:.72rem;margin-top:3px"></p>
  </div>
  <button id="langBtn" onclick="toggleLang()">عربي</button>
</header>

<main>
<!-- ============ DASHBOARD ============ -->
<section class="tab active" id="tab-dash">
  <div class="card">
    <h3 data-i18n="dash_overview"></h3>
    <div class="stats" id="dashStats"></div>
  </div>
  <div class="card">
    <h3 data-i18n="dash_habits"></h3>
    <div id="habitList"></div>
    <p class="small" style="margin-top:8px" data-i18n="dash_habits_note"></p>
  </div>
  <div class="card">
    <h3 data-i18n="dash_targets"></h3>
    <table>
      <tr><th data-i18n="t_metric"></th><th data-i18n="t_target"></th></tr>
      <tr><td data-i18n="t_fasting"></td><td><span class="badge b-green">80–100</span> <span class="small" data-i18n="t_fine115"></span></td></tr>
      <tr><td data-i18n="t_peak"></td><td><span class="badge b-green">&lt;140</span> <span class="small" data-i18n="t_ok180"></span></td></tr>
      <tr><td data-i18n="t_delta"></td><td><span class="badge b-green">&lt;40–50</span></td></tr>
      <tr><td data-i18n="t_avg"></td><td><span class="badge b-green">&lt;115</span></td></tr>
      <tr><td data-i18n="t_tir"></td><td><span class="badge b-green">&gt;90%</span></td></tr>
      <tr><td data-i18n="t_a1c"></td><td><span class="badge b-green">&lt;5.7%</span></td></tr>
    </table>
    <div class="tip" data-i18n-h="t_triggers"></div>
  </div>
</section>

<!-- ============ LOG ============ -->
<section class="tab" id="tab-log">
  <div class="card">
    <h3 data-i18n="log_add"></h3>
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label data-i18n="log_value"></label><input type="number" id="rVal" min="40" max="500" data-i18n-ph="log_ph_val"></div>
      <div style="flex:1"><label data-i18n="log_tag"></label>
        <select id="rTag"></select>
      </div>
    </div>
    <label data-i18n="log_note"></label>
    <input type="text" id="rNote" data-i18n-ph="log_ph_note">
    <button class="btn" onclick="addReading()" data-i18n="log_save"></button>
  </div>
  <div class="card">
    <h3 data-i18n="log_hist"></h3>
    <div class="sw"><button class="btn ghost" onclick="exportCSV()" data-i18n="log_export"></button><button class="btn ghost" onclick="clearAll()" data-i18n="log_clear"></button></div>
    <table id="readTable" style="margin-top:10px"></table>
  </div>
</section>

<!-- ============ MEALS ============ -->
<section class="tab" id="tab-meals">
  <div class="card">
    <h3 data-i18n="m_add"></h3>
    <label data-i18n="m_name"></label>
    <input type="text" id="mName" data-i18n-ph="m_ph_name">
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label data-i18n="m_pre"></label><input type="number" id="mPre" min="40" max="500"></div>
      <div style="flex:1"><label data-i18n="m_post"></label><input type="number" id="mPost" min="40" max="500"></div>
    </div>
    <label data-i18n="m_walk"></label>
    <select id="mWalk"></select>
    <button class="btn" onclick="addMeal()" data-i18n="m_save"></button>
  </div>
  <div class="card">
    <h3 data-i18n="m_lessons"></h3>
    <div id="mealInsights" class="legend"></div>
  </div>
  <div class="card">
    <h3 data-i18n="m_log"></h3>
    <table id="mealTable"></table>
  </div>
  <div class="card">
    <h3 data-i18n="m_rules"></h3>
    <div class="legend" style="line-height:2" data-i18n-h="m_rules_txt"></div>
  </div>
</section>

<!-- ============ CHART ============ -->
<section class="tab" id="tab-chart">
  <div class="card">
    <h3 data-i18n="ch_title"></h3>
    <div class="pill-row" id="chartFilters"></div>
    <canvas id="chart"></canvas>
    <p class="small" style="margin-top:8px" data-i18n="ch_note"></p>
  </div>
</section>

<!-- ============ EXERCISES ============ -->

/* ================= language ================= */
function applyLang(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  document.getElementById('langBtn').textContent=LANG==='ar'?'EN':'عربي';
  document.title=LANG==='ar'?'GlucoTrack — رفيق سكر الدم':'GlucoTrack — Blood Sugar Companion';
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.dataset.i18nPh)});
  document.querySelectorAll('[data-i18n-h]').forEach(el=>{el.innerHTML=t(el.dataset.i18nH)});
  // nav
  document.getElementById('mainNav').innerHTML=NAV.map((n,i)=>
    `<button data-tab="${n[0]}" class="${i===0?'active':''}" onclick="goTab('${n[0]}',this)"><span class="ic">${n[1]}</span>${NAVL[LANG][i]}</button>`).join('');
  // select options
  document.getElementById('rTag').innerHTML=TAGS.map(x=>`<option value="${x}">${TAGL[LANG][x]}</option>`).join('');
  document.getElementById('mWalk').innerHTML=`<option value="no">${t('y_no')}</option><option value="yes">${t('y_yes')}</option>`;
  renderAll();
}
function toggleLang(){LANG=LANG==='ar'?'en':'ar';localStorage.setItem('gt_lang',LANG);applyLang()}
function goTab(id,btn){
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');document.getElementById('tab-'+id).classList.add('active');
  if(id==='chart')drawChart();
  window.scrollTo(0,0);
}

/* ================= readings ================= */
function badgeFor(v){return v<70?['b-red',t('badge_low')]:v<=140?['b-green',t('badge_good')]:v<=180?['b-amber',t('badge_high')]:['b-red',t('badge_vhigh')]}
function fmt(d){return d.toLocaleString(LANG==='ar'?'ar-SA':'en-US')}
function addReading(){
  const v=+document.getElementById('rVal').value;
  if(!v||v<40||v>500){alert(t('enter_val'));return}
  readings.push({v,tag:document.getElementById('rTag').value,note:document.getElementById('rNote').value.trim(),t:Date.now()});
  save(LSk,readings);document.getElementById('rVal').value='';document.getElementById('rNote').value='';
  renderAll();
}
function delReading(i){if(confirm(t('del_confirm_r'))){readings.splice(i,1);save(LSk,readings);renderAll()}}
function clearAll(){if(confirm(t('del_confirm_all'))){readings=[];meals=[];save(LSk,readings);save(LSm,meals);renderAll()}}
function exportCSV(){
  let csv='time,value_mgdl,tag,note\n';
  readings.slice().sort((a,b)=>a.t-b.t).forEach(r=>csv+fmt(new Date(r.t))+','+r.v+',"'+r.tag+'","'+(r.note||'')+'"\n');
  meals.forEach(m=>csv+fmt(new Date(m.t))+',meal: '+m.pre+'->'+m.post+' (delta '+(m.post-m.pre)+'),walk:'+m.walk+',"'+m.name+'"\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='glucotrack_export.csv';a.click();
}
function renderReadings(){
  const tb=document.getElementById('readTable');
  const rows=readings.map((r,i)=>({r,i})).sort((a,b)=>b.r.t-a.r.t);
  tb.innerHTML='<tr><th>'+t('th_when')+'</th><th>'+t('th_value')+'</th><th>'+t('th_tag')+'</th><th>'+t('th_note')+'</th><th></th></tr>'+
    rows.map(({r,i})=>{const[cls,lab]=badgeFor(r.v);
      return `<tr><td class="small">${fmt(new Date(r.t))}</td>
      <td><b>${r.v}</b> <span class="badge ${cls}">${lab}</span></td>
      <td class="small">${TAGL[LANG][r.tag]||r.tag}</td><td class="small">${r.note||''}</td>
      <td><button class="btn ghost" style="width:auto;margin:0;padding:4px 10px" onclick="delReading(${i})">✕</button></td></tr>`}).join('')
    ||`<tr><td class="small">${t('no_readings')}</td></tr>`;
}

/* ================= stats ================= */
function renderStats(){
  const el=document.getElementById('dashStats');
  if(!readings.length){el.innerHTML=`<div class="stat"><div class="v">—</div><div class="l">${t('add_first')}</div></div>`;return}
  const vs=readings.map(r=>r.v),avg=vs.reduce((a,b)=>a+b,0)/vs.length;
  const tir=vs.filter(v=>v>=70&&v<=180).length/vs.length*100;
  const fasting=readings.filter(r=>r.tag==='Fasting');
  const favg=fasting.length?fasting.reduce((a,b)=>a+b.v,0)/fasting.length:null;
  const ea1c=(28.7*avg+46.7)/10;
  el.innerHTML=`
   <div class="stat"><div class="v">${avg.toFixed(0)}</div><div class="l">${t('stat_avg')}</div></div>
   <div class="stat"><div class="v">${ea1c.toFixed(1)}%</div><div class="l">${t('stat_a1c')}</div></div>
   <div class="stat"><div class="v">${tir.toFixed(0)}%</div><div class="l">${t('stat_tir')}</div></div>
   <div class="stat"><div class="v">${favg?favg.toFixed(0):'—'}</div><div class="l">${t('stat_fast')}</div></div>
   <div class="stat"><div class="v">${Math.min(...vs)}–${Math.max(...vs)}</div><div class="l">${t('stat_range')}</div></div>
   <div class="stat"><div class="v">${readings.length}</div><div class="l">${t('stat_n')}</div></div>`;
}

/* ================= meals ================= */
function addMeal(){
  const name=document.getElementById('mName').value.trim();
  const pre=+document.getElementById('mPre').value, post=+document.getElementById('mPost').value;
  if(!name||!pre||!post){alert(t('fill_meal'));return}
  meals.push({name,pre,post,walk:document.getElementById('mWalk').value,t:Date.now()});
  save(LSm,meals);
  document.getElementById('mName').value='';document.getElementById('mPre').value='';document.getElementById('mPost').value='';
  renderAll();
}
function delMeal(i){if(confirm(t('del_confirm_m'))){meals.splice(i,1);save(LSm,meals);renderAll()}}
function renderMeals(){
  const tb=document.getElementById('mealTable');
  tb.innerHTML='<tr><th>'+t('th_when')+' / '+t('m_name')+'</th><th>'+t('m_pre').split(' (')[0]+' → '+t('m_post').split(' (')[0]+'</th><th>Δ</th><th>'+t('t_walk')+'</th><th></th></tr>'+
   meals.slice().reverse().map((m,ri)=>{const i=meals.length-1-ri,d=m.post-m.pre;
     const cls=d<=40?'b-green':d<=60?'b-amber':'b-red';
     const flag=m.post>180?` <span class="badge b-red">${t('peak180')}</span>`:'';
     return `<tr><td class="small">${new Date(m.t).toLocaleDateString(LANG==='ar'?'ar-SA':'en-US')}<br><b>${m.name}</b></td>
      <td>${m.pre} → ${m.post}${flag}</td><td><span class="badge ${cls}">+${d}</span></td>
      <td>${m.walk==='yes'?'🚶✓':'—'}</td>
      <td><button class="btn ghost" style="width:auto;margin:0;padding:4px 10px" onclick="delMeal(${i})">✕</button></td></tr>`}).join('')
   ||`<tr><td class="small">${t('no_meals')}</td></tr>`;
  const el=document.getElementById('mealInsights');
  if(meals.length<2){el.textContent=t('add2meals');return}
  const w=meals.filter(m=>m.walk==='yes'), nw=meals.filter(m=>m.walk==='no');
  let msg=`<b>${meals.length}</b>${t('ins_prefix')}`;
  if(w.length&&nw.length){
    const dw=w.reduce((a,m)=>a+(m.post-m.pre),0)/w.length, dn=nw.reduce((a,m)=>a+(m.post-m.pre),0)/nw.length;
    msg+=`${t('walk_rise')}<b style="color:var(--green)">+${dw.toFixed(0)}</b>${t('no_walk_rise')}<b style="color:var(--red)">+${dn.toFixed(0)}</b>.`;
  } else msg+=t('log_some');
  el.innerHTML=msg;
}

/* ================= chart ================= */
const TAGCOLORS={'Fasting':'#1F4E79','Pre-meal':'#2E8B57','Post-meal (2h)':'#C77700','Bedtime':'#7f8c9b','Other':'#999'};
let chartTagFilter='All';
function renderChartFilters(){
  const tags=['All',...new Set(readings.map(r=>r.tag))];
  document.getElementById('chartFilters').innerHTML=tags.map(x=>
    `<span class="pill ${x===chartTagFilter?'on':''}" onclick="chartTagFilter='${x}';renderChartFilters();drawChart()">${x==='All'?t('all_lbl'):TAGL[LANG][x]}</span>`).join('');
}
function drawChart(){
  const cv=document.getElementById('chart');
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  let data=readings.slice().sort((a,b)=>a.t-b.t);
  if(chartTagFilter!=='All')data=data.filter(r=>r.tag===chartTagFilter);
  const ymin=50,ymax=250;
  const y=v=>H-((v-ymin)/(ymax-ymin))*H;
  ctx.fillStyle='rgba(46,139,87,.08)';ctx.fillRect(0,y(140),W,y(70)-y(140));
  ctx.strokeStyle='#dbe4ec';ctx.lineWidth=1;
  [70,100,140,180,250].forEach(v=>{ctx.beginPath();ctx.moveTo(0,y(v));ctx.lineTo(W,y(v));ctx.stroke();
    ctx.fillStyle='#6b7a88';ctx.font='10px Arial';ctx.fillText(v,4,y(v)-3)});
  ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(46,139,87,.5)';
  ctx.beginPath();ctx.moveTo(0,y(140));ctx.lineTo(W,y(140));ctx.stroke();ctx.setLineDash([]);
  if(data.length<2){ctx.fillStyle='#6b7a88';ctx.font='13px Arial';ctx.fillText(t('add_first'),20,H/2);return}
  ctx.strokeStyle='#2E6DA4';ctx.lineWidth=2;ctx.beginPath();
  data.forEach((r,i)=>{const x=20+(W-40)*i/(data.length-1);const yy=y(Math.min(Math.max(r.v,ymin),ymax));
    i?ctx.lineTo(x,yy):ctx.moveTo(x,yy)});ctx.stroke();
  data.forEach((r,i)=>{const x=20+(W-40)*i/(data.length-1);const yy=y(Math.min(Math.max(r.v,ymin),ymax));
    ctx.fillStyle=TAGCOLORS[r.tag]||'#999';ctx.beginPath();ctx.arc(x,yy,4,0,7);ctx.fill()});
  ctx.fillStyle='#6b7a88';ctx.font='10px Arial';
  const d0=new Date(data[0].t), d1=new Date(data[data.length-1].t);
  const x0=LANG==='ar'?W-60:20, x1=LANG==='ar'?20:W-60;
  ctx.textAlign=LANG==='ar'?'right':'left';
  ctx.fillText(d0.toLocaleDateString(LANG==='ar'?'ar-SA':'en-US'),x0,H-6);
  ctx.fillText(d1.toLocaleDateString(LANG==='ar'?'ar-SA':'en-US'),x1,H-6);
  ctx.textAlign='left';
}

const CATS=[['All','الكل'],['Protein','بروتين'],['Legumes','بقوليات'],['Vegetables','خضروات'],['Fruits','فواكه'],['Grains','حبوب'],['Dairy','ألبان'],['Fats','دهون'],['Sugars','سكريات'],['Drinks','مشروبات']];
let catFilter='All';
const CAT_AR=Object.fromEntries(CATS.map(c=>[c[0],c[1]]));
function renderCatPills(){
  document.getElementById('catPills').innerHTML=CATS.map(c=>
   `<span class="pill ${c[0]===catFilter?'on':''}" onclick="catFilter='${c[0]}';renderCatPills();renderFoods()">${LANG==='ar'?c[1]:c[0]}</span>`).join('');
}
function glBadge(gl){return gl<10?'b-green':gl<=19?'b-amber':'b-red'}
function giBadge(gi){return gi<55?'b-green':gi<=69?'b-amber':'b-red'}
function verdict(f){const v=f[8];return v==='g'?t('v_free'):v==='a'?t('v_pair'):t('v_limit')}
let foodSort={key:'gl',dir:'desc'};
function sortFoods(k){
  if(foodSort.key===k){foodSort.dir=foodSort.dir==='asc'?'desc':'asc';}
  else{foodSort.key=k;foodSort.dir=(k==='name')?'asc':'desc';}
  renderFoods();
}
function renderFoods(){
  const q=(document.getElementById('foodSearch').value||'').toLowerCase();
  let rows=FOODS.filter(f=>(catFilter==='All'||f[2]===catFilter)&&(f[0].toLowerCase().includes(q)||f[1].includes(q)||f[2].toLowerCase().includes(q)||CAT_AR[f[2]].includes(q)));
  const dir=foodSort.dir==='asc'?1:-1;
  const nameIdx=LANG==='ar'?1:0;
  const vo={g:0,a:1,r:2};
  rows.sort((a,b)=>{
    if(foodSort.key==='name') return dir*a[nameIdx].localeCompare(b[nameIdx],LANG==='ar'?'ar':'en');
    if(foodSort.key==='gi') return dir*(a[4]-b[4]);
    if(foodSort.key==='gl') return dir*(a[5]-b[5]);
    if(foodSort.key==='verdict') return dir*(vo[a[8]]-vo[b[8]]);
    return 0;
  });
  const arrow=k=>foodSort.key===k?(foodSort.dir==='asc'?' \u25B2':' \u25BC'):'';
  const th=(k,l)=>`<th style="cursor:pointer;user-select:none" onclick="sortFoods('${k}')">${l}${arrow(k)}</th>`;
  document.getElementById('foodTable').innerHTML=
   `<tr>${th('name',t('col_food'))}${th('gi',t('col_gi'))}${th('gl',t('col_gl'))}<th>${t('col_serv')}</th>${th('verdict',t('col_verdict'))}</tr>`+
   rows.map(f=>{
     const name=LANG==='ar'?f[1]:f[0], note=LANG==='ar'?f[10]:f[9], serv=LANG==='ar'?f[7]:f[6];
     const v=f[8], vc=v==='g'?'green':v==='a'?'amber':'red';
     return `<tr><td class="foodname">${name}<br><span class="small">${note}</span></td>
    <td><span class="badge ${giBadge(f[4])}">${f[4]}</span></td>
    <td><span class="badge ${glBadge(f[5])}">${f[5]}</span></td>
    <td class="small">${serv}</td>
    <td><span class="badge b-${vc}">${verdict(f)}</span></td></tr>`}).join('')
   ||`<tr><td class="small">${t('no_match')}</td></tr>`;
}

/* ================= init ================= */
function renderAll(){renderStats();renderReadings();renderMeals();renderHabits();renderChartFilters();drawChart();renderCatPills();renderFoods()}
applyLang();
window.addEventListener('resize',()=>{const c=document.getElementById('tab-chart');if(c.classList.contains('active'))drawChart()});
</script>
